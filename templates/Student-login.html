<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Login</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background-color: antiquewhite;
                color: black;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 6%;
                background-color: antiquewhite;
                border-bottom: 1px solid #ccc;
            }
            .logo {
                font-size: 26px;
                font-weight: bold;
                color: rgba(0, 0, 0, 0.813);
            }
            .tagline {
                font-size: 14px;
                color: #666;
                margin-top: 5px;
            }
            .login {
                text-decoration: none;
                color: #333;
                font-weight: bold;
                padding: 10px 18px;
                border: 1px solid #333;
                border-radius: 8px;
            }
            .login:hover {
                background-color: #333;
                color: #fff;
            }
            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 60px 20px;
            }
            h1 {
                font-size: 36px;
                margin-bottom: 10px;
            }
            .login-card {
                background-color: white;
                padding: 30px;
                border-radius: 15px;
                box-shadow: 0 8px 20px rgba(0,0,0,0.1);
                width: 100%;
                max-width: 400px;
                margin-top: 20px;
            }
            .input-group {
                margin-bottom: 20px;
                text-align: left;
            }
            label {
                display: block;
                font-weight: bold;
                margin-bottom: 5px;
                font-size: 14px;
            }
            input {
                width: 100%;
                padding: 12px;
                border: 1px solid #ccc;
                border-radius: 8px;
                box-sizing: border-box;
            }
            .btn {
                width: 100%;
                padding: 12px;
                background-color: #198754;
                color: white;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
            }
            .btn:hover {
                background-color: #157347;
            }
            .signup-text {
                margin-top: 15px;
                text-align: center;
                font-size: 14px;
                color: #666;
            }
            .signup-text a {
                color: #198754;
                text-decoration: none;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header>
            <div>
                <div class="logo">Hunger Hunt</div>
                <div class="tagline">Student Portal</div>
            </div>
            <a href="index.html" class="login">Back to Home</a>
        </header>

        <main>
            <h1>Welcome Back</h1>
            <p>Please enter your student credentials to continue.</p>
            
            <div class="login-card">
                <form>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
                <div class="signup-text">
                    Don't have an account? <a href="student-signup.html">Sign up</a>
                </div>
            </div>
        </main>
    </body>
</html>
