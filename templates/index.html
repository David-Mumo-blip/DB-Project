<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Hunger Hunt</title>
        <style>
            body{
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background-color:antiquewhite;
                color: black;
            }
            header{
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 6%;
                background-color:antiquewhite;
                border-bottom: 1px solid #ccc;
            }
            .logo{
                font-size: 26px;
                font-weight: bold;
                color: rgba(0, 0, 0, 0.813);
            }
            
            .tagline{
                    font-size: 14px;
                    color: #666;
                    margin-top:5px;
                }
            .login{
                text-decoration: none;
                color: #333;
                font-weight: bold;
                padding: 10px 18px;
                border: 1px solid #333;
                border-radius: 8px;
            }
            .login:hover{
                background-color: #333;
                color: #fff;
            }
            .hero-image{
                width:80%;
                max-width:700px;
                height:350px;
                object-fit:cover;
                border-radius: 20px;
                margin-top: 20px;
                box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            }
            main{
                text-align: center;
                padding:100px 20px;
            }
            h1{ 
                font-size: 40px;
                margin-bottom: 15px;
            }
            .description{
                font-size: 18px;
                color: #666;
                margin-bottom: 30px;
            }
         </style>
    </head>
          <body>
             <header>
                    <div>
                        <div
                        class="logo">Hunger Hunt</div>
                        <div class="tagline">Find your favorite food in Siwaka</div>
                    </div>
                    <a href="login.html" class="login">Login</a>
                </header>
                <main>
                    <h1>Welcome to Hunger Hunt</h1>
                    <p class="description">Discover the best food options in Siwaka or Strathmore and satisfy your cravings!</p>
                    <img src="images/eatingburger.webp"
                    alt="Delicious Shawarma"
                    class="hero-image">
                    <img src="images/eating3.webp"
                    alt="Amazing food"
                    class="hero-image">
                    <img src="images/eating2.webp"
                    alt="good stuff"
                    class="hero-image">
                </main>
            </body>
        </head>
        </html>
